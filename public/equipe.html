<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GI N' HAIR au complet</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
  <section class="section" style="padding-bottom:10px">
    <div class="wrap">
      <span class="stamp">Trombinoscope officiel</span>
      <h1 class="outlined">GI N' HAIR au complet</h1>
      <p class="lead" style="max-width:40em">Clique sur une carte pour découvrir le joueur.</p>
    </div>
  </section>
  <div class="wrap">
    <h2 class="squad-title">Les titulaires</h2>
    <div class="fifa-row" id="cards"></div>
    <h2 class="squad-title">Le remplaçant</h2>
    <div class="fifa-row bench" id="subs"></div>
    <div id="team"></div>
  </div>
</main>

<div class="modal" id="warn">
  <div class="card warn-card">
    <div style="font-size:3rem;line-height:1">⚠️</div>
    <h2>Êtes-vous sûr de vouloir voir ce que vous allez voir ?</h2>
    <p>Cette image peut heurter la sensibilité des coiffeurs, des nuques fragiles et des personnes qui ont déjà mangé.</p>
    <div class="ctas" style="justify-content:center">
      <button class="btn" id="warn-yes">Oui, j'assume</button>
      <button class="btn light" id="warn-no">Non, j'ai peur</button>
    </div>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
(() => {
  const root = $('#team');
  const stats = (b) => b.fifa.stats.map(([k, v]) => `<li><b>${v}</b> ${k}</li>`).join('');
  for (const [slug, b] of Object.entries(TEAM)) {
    const c = document.createElement('button');
    c.className = b.sub ? 'fifa silver' : 'fifa';
    c.dataset.slug = slug;
    c.style.setProperty('--c', b.color);
    c.innerHTML = `
      <span class="fifa-top"><b>${b.fifa.note}</b><small>${b.sub ? 'REM' : 'BRB'}</small><img src="/img/favicon.png" alt=""></span>
      <span class="fifa-face">${b.avatar ? `<img src="/img/${b.avatar}" alt="">` : b.name[0]}</span>
      <span class="fifa-name">${b.name}</span>
      <ul class="fifa-stats">${stats(b)}</ul>
      <span class="fifa-cta">Voir la fiche</span>`;
    c.onclick = () => open(slug, true);
    $(b.sub ? '#subs' : '#cards').appendChild(c);
  }

  // Musique de la page : se lance dès l'arrivée. Si le navigateur bloque le son tant qu'on n'a pas
  // touché la page (iPhone notamment), elle démarre au premier clic ou appui.
  const audio = teamAudio();
  let muted = false;
  const speaker = '<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
  const mute = document.createElement('button');
  mute.className = 'mute-btn';
  mute.type = 'button';
  const label = () => {
    const on = !muted && !audio.paused;
    mute.innerHTML = `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${speaker}${on ? '<path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/>' : '<path d="M16 9l5 6M21 9l-5 6"/>'}</svg>`;
    mute.title = mute.ariaLabel = on ? 'Couper la musique' : 'Lancer la musique';
  };
  audio.onplay = audio.onpause = label;
  mute.onclick = (e) => {
    e.stopPropagation();
    muted = !audio.paused;
    if (muted) audio.pause(); else audio.play().catch(() => {});
  };
  document.body.appendChild(mute);
  label();
  const start = (e) => {
    if (e.target.closest?.('.mute-btn')) return;
    if (!muted && audio.paused) audio.play().catch(() => {});
    if (!audio.paused) ['pointerdown', 'keydown', 'touchstart'].forEach((t) => removeEventListener(t, start));
  };
  ['pointerdown', 'keydown', 'touchstart'].forEach((t) => addEventListener(t, start));
  audio.play().catch(() => {});

  function open(slug, scroll) {
    const b = TEAM[slug];
    if (!b) return;
    document.querySelectorAll('.fifa').forEach((c) => c.classList.toggle('active', c.dataset.slug === slug));
    history.replaceState(null, '', `#${slug}`);
    root.innerHTML = '';
    const el = document.createElement('section');
    el.className = 'barber';
    el.id = `fiche-${slug}`;
    el.innerHTML = `
      <div class="id-card card">
        <button class="btn small ghost close-fiche" type="button">✕ Fermer</button>
        <div class="avatar" style="background:${b.color}">${b.avatar ? `<img src="/img/${b.avatar}" alt="${b.name}">` : b.name[0]}</div>
        <h2 style="margin:0">${b.name}</h2>
        <p class="marker" style="color:${b.color};margin:.2em 0 0">${esc(b.title)}</p>
        ${b.insta ? `<a class="insta sticker" href="${instaUrl(b.insta)}" target="_blank" rel="noopener">📸 @${esc(b.insta)}${b.instaNote ? `<small>${esc(b.instaNote)}</small>` : ''}</a>` : ''}
        ${b.snap ? `<a class="snap sticker" href="${snapUrl(b.snap)}" target="_blank" rel="noopener">👻 ${esc(b.snap)}${b.snapNote ? `<small>${esc(b.snapNote)}</small>` : ''}</a>` : ''}
        <p>${esc(b.bio)}</p>
        <ul class="stats">${b.stats.map(([k, v]) => `<li><span class="muted">${esc(k)}</span><b>${esc(v)}</b></li>`).join('')}</ul>
        ${b.sub ? '' : `<p style="margin-top:18px"><a class="btn small" style="background:${b.color}" href="/rdv?barber=${slug}">RDV avec ${b.name}</a></p>`}
      </div>
      <div class="board-col"><div class="board"></div></div>`;
    const board = $('.board', el);
    if (b.guests) {
      const vip = document.createElement('section');
      vip.className = 'guests';
      vip.innerHTML = '<h3 class="guests-title">★ Special Guest ★</h3><div class="guests-row"></div>';
      const pics = b.guests.map((g) => [g[0], '']);
      b.guests.forEach((g, i) => {
        const f = polaroid([g[0], g[1]], i, () => lightbox(pics, i));
        f.classList.add('gold');
        f.insertAdjacentHTML('afterbegin', '<span class="stars">★ ★ ★</span>');
        $('.guests-row', vip).appendChild(f);
      });
      board.before(vip);
    }
    if (b.photos.length) {
      const pics = b.photos.map((p) => [p[0], '']);
      pics.forEach((p, i) => board.appendChild(polaroid(p, i, () => lightbox(pics, i))));
    } else {
      board.innerHTML = `<div class="empty">Photos bientôt disponibles.<br>${b.name} est encore en train de tondre.</div>`;
    }
    const hist = document.createElement('section');
    hist.className = 'histoire';
    hist.innerHTML = `<div class="tape-line"><span>UN PETIT PEU D'HISTOIRE · LA PREMIÈRE COUPE</span></div>`;
    if (b.debuts) {
      hist.insertAdjacentHTML('beforeend', `
        <div class="crime">
          <figure class="polaroid censored" style="--r:-3deg">
            <img src="/img/${b.debuts.photo}" alt="La toute première coupe de ${b.name}">
            <button class="censor" type="button"><b>CENSURÉ</b><span>Clique pour décensurer</span></button>
            <figcaption>${esc(b.debuts.caption)}</figcaption>
          </figure>
          <div class="card">
            <h2>Rapport d'incident</h2>
            <dl class="report">${b.debuts.report.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
          </div>
        </div>`);
      const fig = $('.polaroid', hist);
      $('.censor', hist).onclick = () => {
        $('#warn').classList.add('open');
        $('#warn-yes').focus();
        $('#warn-yes').onclick = () => { $('#warn').classList.remove('open'); fig.classList.remove('censored'); };
      };
    } else {
      hist.insertAdjacentHTML('beforeend', `<div class="card debuts-soon">
        <h2 style="margin:0 0 .3em">Dossier en cours d'instruction</h2>
        <p style="margin:0">${b.soon || (slug === 'gatien' ? 'Les photos existent. Gatien nie tout en bloc.' : "Les preuves sont encore sous scellés. L'enquête suit son cours.")}</p>
      </div>`);
    }
    $('.close-fiche', el).onclick = () => {
      root.innerHTML = '';
      document.querySelectorAll('.fifa').forEach((c) => c.classList.remove('active'));
      history.replaceState(null, '', location.pathname);
      $(b.sub ? '#subs' : '#cards').scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    root.append(el, hist);
    if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('#warn-no').onclick = () => { $('#warn').classList.remove('open'); toast('Sage décision.'); };
  $('#warn').onclick = (e) => { if (e.target.id === 'warn') e.target.classList.remove('open'); };
  if (location.hash) open(location.hash.slice(1), true);
})();
</script>
</body>
</html>
